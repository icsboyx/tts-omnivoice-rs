# NVIDIA GeForce RTX 20 / GTX 16 series (Turing): CUDA architecture 75.
name: tts-omnivoice-rs
services:
  tts:
    build:
      context: ../..
      dockerfile: docker-compose/Dockerfile
      args:
        GPU_TARGETS: "75"
    image: tts-omnivoice-rs:nvidia-rtx-20-turing
    ports:
      # Loopback only: the server has no authentication.
      - "127.0.0.1:8002:8002"
    volumes:
      - ../../xtts/models:/data/models:ro
      - ../../xtts/samples:/data/samples:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The server does not handle SIGTERM; an init process lets `docker compose down` stop it at once.
    init: true
    restart: unless-stopped
